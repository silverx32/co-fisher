<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; pointer-events: none; }
  .splat { position: absolute; transform-origin: center; }
  .splat.in { animation: splatIn .35s cubic-bezier(.2, 1.6, .4, 1) both; }
  .splat.out { animation: splatOut 1s ease-in forwards; }
  @keyframes splatIn { 0% { transform: scale(.15) rotate(var(--rot)); opacity: .6; } 100% { transform: scale(1) rotate(var(--rot)); opacity: 1; } }
  @keyframes splatOut { from { transform: scale(1) rotate(var(--rot)); opacity: 1; } to { transform: scale(1.04) translateY(40px) rotate(var(--rot)); opacity: 0; } }
  .drip { transform-box: fill-box; transform-origin: top; animation: drip var(--d) ease-in forwards; transform: scaleY(0); }
  @keyframes drip { to { transform: scaleY(1); } }
  .fly { animation: buzz var(--d) linear infinite; transform-box: view-box; }
  @keyframes buzz { to { transform: rotate(360deg); } }
  .wing { animation: flap .06s infinite alternate; transform-box: fill-box; transform-origin: bottom; }
  @keyframes flap { to { transform: scaleY(.3); } }
  .stink { animation: stink 1.6s ease-in-out infinite alternate; }
  @keyframes stink { to { transform: translateY(-14px); opacity: .3; } }
  .missile { position: absolute; font-size: 130px; line-height: 1; filter: drop-shadow(0 8px 10px rgba(0,0,0,.35)); }
  #banners { position: absolute; top: 8%; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 5; }
  .banner {
    background: rgba(30, 30, 40, .85); color: #fff; font: bold 24px "Microsoft YaHei UI", sans-serif;
    padding: 10px 26px; border-radius: 30px; white-space: nowrap; animation: banner 4s forwards;
  }
  @keyframes banner { 0% { opacity: 0; transform: translateY(-20px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div id="banners"></div>
<script src="api.js"></script>
<script src="overlay.js"></script>
</body>
</html>
